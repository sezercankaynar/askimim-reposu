[project]
name = "tarif-worker"
version = "0.1.0"
description = "Tarif Defterim – linkten tarif çıkaran arka plan servisi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "supabase>=2.5",
  "anthropic>=0.34",
  "yt-dlp>=2024.8.6",
  "extruct>=0.17",
  "trafilatura>=1.12",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pillow>=10.4",
  "structlog>=24.4",
  "tenacity>=8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
